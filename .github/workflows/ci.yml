name: CI
on:
  pull_request:
  push:
    branches:
      - main
permissions:
  contents: read
jobs:
  linux:
    name: Linux
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: /usr/lib/ccache/clang
            cxxcompiler: /usr/lib/ccache/clang++
            linker: lld
          - compiler: /usr/lib/ccache/gcc-14
            cxxcompiler: /usr/lib/ccache/g++-14
            linker: bfd
    env:
      CC: ${{ matrix.compiler }}
      CXX: ${{ matrix.cxxcompiler }}
      LDFLAGS: -fuse-ld=${{ matrix.linker }}
      CCACHE_DIR: ${{ github.workspace }}/.ccache
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          echo '::group::Update apt'
          sudo apt-get -qq update
          echo '::endgroup::'

          echo '::group::Install packages'
          sudo apt-get install -qqy --no-install-recommends \
            gperf \
            libgnutls28-dev \
            libgtk-3-dev \
            libicu-dev \
            libpcre2-dev \
            libsystemd-dev \
            ninja-build \
            meson \
            lld \
            clang \
            gcc-14 \
            g++-14 \
            ccache
          echo '::endgroup::'
      - name: Create ccache directory
        run: |
          mkdir -p "${CCACHE_DIR}"
          du -sh "${CCACHE_DIR}" && ccache -s
        shell: bash
      - name: Cache ccache
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: "${CCACHE_DIR}"
          key: ${{ github.job }}-${{ matrix.compiler }}
          restore-keys: |
            ${{ github.job }}-${{ matrix.compiler }}
      - name: Install GCC problem matcher
        uses: ammaraskar/gcc-problem-matcher@0f9c86f9e693db67dacf53986e1674de5f2e5f28 # 0.3.0
      - name: Build
        run: |
          echo '::group::Configure'
          meson setup --prefix /usr _build -Dbuildtype=debugoptimized
          echo '::endgroup::'

          echo '::group::Compile'
          meson compile -C _build
          echo '::endgroup::'
      - name: Test
        run: |
          meson test -C _build
