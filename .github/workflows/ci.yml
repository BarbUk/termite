name: CI
on:
  pull_request:
  push:
    branches:
      - main
permissions:
  contents: read
jobs:
  linux:
    name: Linux
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: clang
            cxxcompiler: clang++
            linker: lld
          - compiler: gcc-14
            cxxcompiler: g++-14
            linker: bfd
    env:
      CC: ${{ matrix.compiler }}
      CXX: ${{ matrix.cxxcompiler }}
      LDFLAGS: -fuse-ld=${{ matrix.linker }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          echo '::group::Update apt'
          sudo apt-get -qq update
          echo '::endgroup::'

          echo '::group::Install packages'
          sudo apt-get install -qqy --no-install-recommends \
            gperf \
            libgnutls28-dev \
            libgtk-3-dev \
            libicu-dev \
            libpcre2-dev \
            libsystemd-dev \
            ninja-build \
            meson \
            lld \
            clang \
            gcc-14 \
            g++-14 \
            ccache
          echo '::endgroup::'
      - name: ccache
        uses: hendrikmuhs/ccache-action@33522472633dbd32578e909b315f5ee43ba878ce # v1.2.22
        with:
          key: ${{ matrix.compiler }}
          create-symlink: true
      - name: Install GCC problem matcher
        uses: ammaraskar/gcc-problem-matcher@0f9c86f9e693db67dacf53986e1674de5f2e5f28 # 0.3.0
      - name: Build
        run: |
          export PATH="/usr/lib/ccache:/usr/local/opt/ccache/libexec:$PATH"
          echo '::group::Configure'
          meson setup --prefix /usr _build -Dbuildtype=debugoptimized
          echo '::endgroup::'

          echo '::group::Compile'
          meson compile -C _build
          echo '::endgroup::'
      - name: Test
        run: |
          meson test -C _build
