name: Release
on:
  push:
    tags:
      - 'v*'
permissions:
  id-token: write
  contents: read
  attestations: write
jobs:
  build-and-release:
    name: Build and Release
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build \
            meson \
            pigz
      - name: Build
        env:
          CC: gcc-14
          CXX: g++-14
        run: |
          meson setup _build -Dbuildtype=release
      - name: Prepare Assets
        run: |
          rm -rf _build
          tar cf - . | pigz > "/termite-${GITHUB_REF_NAME}.tar.gz"
      - name: Generate artifact attestation
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-path: "/termite-${GITHUB_REF_NAME}.tar.gz"
      - name: Create Release
        run: |
          gh release create --generate-notes --verify-tag "${GITHUB_REF#refs/*/}" -t "${GITHUB_REF#refs/*/}" --draft "/termite-${GITHUB_REF_NAME}.tar.gz"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
