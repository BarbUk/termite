name: Release
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: write
jobs:
  build-and-release:
    name: Build and Release
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get -qq update
          sudo apt-get -qq install -y --no-install-recommends \
            build-essential \
            ca-certificates \
            libgtk-3-dev \
            libicu-dev \
            libpcre2-dev \
            libsystemd-dev \
            liblz4-dev \
            libgnutls28-dev \
            ninja-build \
            meson \
            pigz \
            gcc \
            g++ \
            lld \
            git
      - name: Build
        env:
          CC: gcc-14
          CXX: g++-14
        run: |
          meson setup _build -Dbuildtype=release
      - name: Prepare Assets
        run: |
          /usr/bin/tar --posix -cf "termite-${GITHUB_REF_NAME}.tar.zst" --exclude "termite-${GITHUB_REF_NAME}.tar.zst" --exclude .git -P -C . --files-from release.txt --use-compress-program zstdmt
      - name: Create Release
        run: |
          gh release create --generate-notes --verify-tag "${GITHUB_REF#refs/*/}" -t "${GITHUB_REF#refs/*/}" --draft "termite-${GITHUB_REF_NAME}.tar.zst"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
