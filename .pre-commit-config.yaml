default_install_hook_types:
  - pre-commit
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # frozen: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-case-conflict
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: check-merge-conflict
      - id: check-symlinks
      - id: destroyed-symlinks
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: fix-byte-order-marker
      - id: check-yaml
      - id: trailing-whitespace
        exclude: ".(md|rst)$"
      - id: mixed-line-ending
      - id: check-json
      - id: pretty-format-json
        args:
          - --autofix
  # YAML
  - repo: https://github.com/adrienverge/yamllint.git
    rev: cba56bcde1fdd01c1deb3f945e69764c291a6530 # frozen: v1.38.0
    hooks:
      - id: yamllint
        args: ["-d relaxed"]
  - repo: https://github.com/google/yamlfmt
    rev: 21ca5323a9c87ee37a434e0ca908efc0a89daa07 # frozen: v0.21.0
    hooks:
      - id: yamlfmt
        language: system
  # Spelling
  - repo: https://github.com/crate-ci/typos
    rev: 631208b7aac2daa8b707f55e7331f9112b0e062d # frozen: v1.44.0
    hooks:
      - id: typos
        args:
          - --no-check-files
          - meson.build
  # Github action
  - repo: https://github.com/rhysd/actionlint
    rev: 393031adb9afb225ee52ae2ccd7a5af5525e03e8 # frozen: v1.7.11
    hooks:
      - id: actionlint-system
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: ea2eb407b4cbce87cf0d502f36578950494f5ac9 # frozen: v1.23.1
    hooks:
      - id: zizmor
  # Markdown
  - repo: https://github.com/rvben/rumdl-pre-commit
    rev: e8689b0f1c8828c81c5bde980a5e285e22787455 # frozen: v0.1.57
    hooks:
      - id: rumdl-fmt
        args:
          - --disable
          - MD013
  # Cpp
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: 88c364bab316f4b6b18f6c298133bbbf32d7cd15 # frozen: v22.1.1
    hooks:
      - id: clang-format
        types_or: [c++, c]
        args: [--style=Google]
